name: Keep Supabase Alive

on:
  schedule:
    # Runs at 06:00 UTC every 3 days
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://miujrfvwbzyoozqxtbby.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_8_suIN271CYZpfPlv5V7yQ_78roMWjY' }}
        run: |
          echo "Sending keep-alive ping to Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase project is active and alive!"
          else
            echo "⚠️ Unexpected status $HTTP_STATUS, checking root endpoint..."
            curl -f -s -X GET "${SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" > /dev/null
            echo "✅ Supabase ping complete."
          fi
